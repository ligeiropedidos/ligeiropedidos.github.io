<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 84">
  <!-- borboleta da Cris Modas (18/11/2026): o traco rosa com as asas em degrade, como as do cartao dela -->
  <defs>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FB8"/>
      <stop offset="0.55" stop-color="#F45A93"/>
      <stop offset="1" stop-color="#D4215F"/>
    </linearGradient>
    <linearGradient id="asa2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC2D8"/>
      <stop offset="1" stop-color="#F06A9C"/>
    </linearGradient>
    <g id="lado">
      <!-- asa de cima -->
      <path d="M51 40 C 56 22, 70 6, 88 6 C 97 6, 98 16, 94 25 C 89 36, 70 43, 51 42 Z" fill="url(#asa)" stroke="#B0174E" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M55 37 C 62 25, 73 15, 86 13 M58 39 C 68 33, 80 27, 91 22" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round"/>
      <!-- asa de baixo -->
      <path d="M51 44 C 64 44, 78 49, 80 60 C 82 72, 72 78, 64 72 C 57 67, 53 56, 51 46 Z" fill="url(#asa2)" stroke="#B0174E" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M54 48 C 61 52, 70 58, 72 68" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="84" cy="15" r="2.4" fill="#FFFFFF" fill-opacity="0.85"/>
      <circle cx="73" cy="64" r="1.8" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>
  </defs>
  <use href="#lado"/>
  <use href="#lado" transform="translate(100 0) scale(-1 1)"/>
  <!-- corpo e antenas -->
  <ellipse cx="50" cy="45" rx="2.6" ry="15" fill="#8E1240"/>
  <path d="M49 31 C 46 20, 41 14, 36 11 M51 31 C 54 20, 59 14, 64 11" fill="none" stroke="#8E1240" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="36" cy="11" r="1.8" fill="#8E1240"/>
  <circle cx="64" cy="11" r="1.8" fill="#8E1240"/>
</svg>
